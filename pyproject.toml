[project]
name = "plastic-infer"
version = "0.1.0"
description = "Elastic inference kernel: GPU VRAM + CPU RAM + disk tiered storage"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "safetensors>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-randomly>=3.0",
]
cli = [
    "tokenizers>=0.19",
]

[project.scripts]
plastic-infer = "plastic_infer.runtime.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests requiring a GPU",
    "slow: slow integration tests",
]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
